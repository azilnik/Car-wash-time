name: Tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/*.yml"

# This is a fast, offline test run — no need to grant write permissions.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Run test suite
        run: python3 -m unittest discover -s scripts/tests -v
