name: Keepalive

on:
  schedule:
    # Run once a month on the 1st at midnight UTC
    - cron: "0 0 1 * *"

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/workflows \
            --jq '.workflows[] | select(.state == "disabled_inactivity") | .id' \
          | while read -r wf_id; do
              echo "Re-enabling workflow $wf_id"
              gh api -X PUT "repos/${{ github.repository }}/actions/workflows/${wf_id}/enable"
            done
          echo "Done"
