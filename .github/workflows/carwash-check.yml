name: Daily Car Wash Check

on:
  schedule:
    # 6:00 AM EST = 11:00 UTC (7:00 AM during EDT)
    - cron: "0 11 * * *"
    # 9:30 PM EST = 02:30 UTC (10:30 PM during EDT)
    - cron: "30 2 * * *"
  workflow_dispatch:

# ── Configuration ─────────────────────────────────────────────────────
# Override these by going to:
#   Settings → Secrets and variables → Actions → Variables
# and creating LATITUDE, LONGITUDE, and NTFY_TOPIC.
#
# The defaults below point at London, UK and a shared public demo ntfy
# topic — fine for a "does it work?" test, but you'll want your own
# topic for privacy (anyone subscribed to the demo topic sees everyone
# else's notifications).
#
# VARS_* mirror the raw repo-variable values so the script can tell
# whether each setting is customized or falling back to a demo default.
env:
  LATITUDE:   ${{ vars.LATITUDE   || '51.5074'  }}
  LONGITUDE:  ${{ vars.LONGITUDE  || '-0.1278'  }}
  NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'car-wash-time-demo-a9k2p4xe' }}
  VARS_LAT:   ${{ vars.LATITUDE   }}
  VARS_LON:   ${{ vars.LONGITUDE  }}
  VARS_TOPIC: ${{ vars.NTFY_TOPIC }}

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check weather and notify
        run: bash scripts/check.sh
