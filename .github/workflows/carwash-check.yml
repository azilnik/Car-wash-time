name: Daily Car Wash Check

on:
  schedule:
    # Run every day at 8:00 AM UTC
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      latitude:
        description: "Latitude (overrides secret)"
        required: false
      longitude:
        description: "Longitude (overrides secret)"
        required: false

env:
  LATITUDE: ${{ inputs.latitude || secrets.LATITUDE }}
  LONGITUDE: ${{ inputs.longitude || secrets.LONGITUDE }}
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  DRY_DAYS: ${{ secrets.DRY_DAYS || '3' }}

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Check weather and notify
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${LATITUDE:-}" ] || [ -z "${LONGITUDE:-}" ]; then
            echo "::error::LATITUDE and LONGITUDE secrets must be set."
            exit 1
          fi

          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "::error::NTFY_TOPIC secret must be set."
            exit 1
          fi

          echo "Fetching forecast for ($LATITUDE, $LONGITUDE)..."

          RESPONSE=$(curl -sf "https://api.open-meteo.com/v1/forecast?\
          latitude=${LATITUDE}&longitude=${LONGITUDE}\
          &daily=weather_code,precipitation_sum,precipitation_probability_max\
          &timezone=auto&forecast_days=7")

          echo "Parsing forecast..."

          # Precipitation WMO codes
          PRECIP_CODES="51 53 55 56 57 61 63 65 66 67 71 73 75 77 80 81 82 85 86 95 96 99"

          ALL_DRY=true
          FORECAST_SUMMARY=""

          for i in $(seq 1 "$DRY_DAYS"); do
            DATE=$(echo "$RESPONSE"      | jq -r ".daily.time[$i]")
            CODE=$(echo "$RESPONSE"      | jq -r ".daily.weather_code[$i]")
            PRECIP=$(echo "$RESPONSE"    | jq -r ".daily.precipitation_sum[$i]")
            PROB=$(echo "$RESPONSE"      | jq -r ".daily.precipitation_probability_max[$i]")

            IS_WET=false
            for pc in $PRECIP_CODES; do
              if [ "$CODE" = "$pc" ]; then IS_WET=true; break; fi
            done

            PRECIP_INT=$(echo "$PRECIP" | cut -d. -f1)
            if [ "${PRECIP_INT:-0}" -gt 0 ] || [ "${PROB:-0}" -gt 30 ]; then
              IS_WET=true
            fi

            STATUS="Dry"
            if [ "$IS_WET" = true ]; then
              STATUS="Wet"
              ALL_DRY=false
            fi

            FORECAST_SUMMARY="${FORECAST_SUMMARY}${DATE}: code=${CODE} precip=${PRECIP}mm prob=${PROB}% [${STATUS}]\n"
            echo "$DATE: code=$CODE precip=${PRECIP}mm prob=${PROB}% [$STATUS]"
          done

          if [ "$ALL_DRY" = true ]; then
            echo "All dry! Sending notification..."
            curl -sf \
              -H "Title: Time for a Car Wash!" \
              -H "Tags: car,white_check_mark" \
              -d "No rain or snow expected in the next ${DRY_DAYS} days.

          $(echo -e "$FORECAST_SUMMARY")" \
              "https://ntfy.sh/${NTFY_TOPIC}"
            echo "Notification sent!"
          else
            echo "Precipitation expected -- skipping notification."
          fi
