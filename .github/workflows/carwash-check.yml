name: Daily Car Wash Check

on:
  schedule:
    # GitHub runs scheduled workflows late and drops many firings (on this
    # repo they land roughly every 5 hours, not every 30 minutes). The
    # script doesn't care: the first firing in the overnight prep window
    # hands the notification to ntfy with a delivery time of MORNING_HOUR,
    # so it arrives on time anyway. Firing often just raises the odds that
    # one lands in the window. Off-peak minutes (not :00/:30) get dropped less.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Send a notification right now (for testing). Doesn't affect the scheduled one."
        type: boolean
        default: false

# ── Configuration ─────────────────────────────────────────────────────
# Override these under Settings → Secrets and variables → Actions →
# Variables. LOCATION and NTFY_TOPIC are the only ones most people need.
#
# LOCATION accepts anything Nominatim can resolve: city, address, postal
# code. When set it wins over LATITUDE/LONGITUDE; it's geocoded once and
# cached in state.json.
#
# MORNING_HOUR is the local hour the daily verdict arrives (default 8 =
# 8:00 AM; decimals OK, 7.5 = 7:30). Timezone and DST come from your
# coordinates automatically.
#
# MIN_WASH_TEMP_C: if tonight's low drops below this (°C), the verdict is
# "🥶 Too cold for a wash". Default -5; set -100 to disable.
#
# The LATITUDE/LONGITUDE defaults point at New York City and a shared
# public demo topic, fine for a "does it work?" test only.
#
# VARS_* mirror the raw repo-variable values so the script can tell
# whether each setting is customized or falling back to a demo default.
env:
  LOCATION:         ${{ vars.LOCATION         }}
  LATITUDE:         ${{ vars.LATITUDE         || '40.7128'  }}
  LONGITUDE:        ${{ vars.LONGITUDE        || '-74.0060' }}
  NTFY_TOPIC:       ${{ vars.NTFY_TOPIC       || 'car-wash-time-demo-a9k2p4xe' }}
  MORNING_HOUR:     ${{ vars.MORNING_HOUR     || '8' }}
  MIN_WASH_TEMP_C:  ${{ vars.MIN_WASH_TEMP_C  || '-5' }}
  FORCE_RUN:        ${{ inputs.force_run }}
  VARS_LAT:         ${{ vars.LATITUDE         }}
  VARS_LON:         ${{ vars.LONGITUDE        }}
  VARS_TOPIC:       ${{ vars.NTFY_TOPIC       }}

# contents:write lets the job commit state.json back to main. That commit
# is how runs remember the day is handled, and the daily activity keeps
# GitHub from auto-disabling the schedule after 60 quiet days.
permissions:
  contents: write

# Bunched-up scheduled runs would otherwise read the same state.json and
# both notify. Queue them instead.
concurrency:
  group: carwash-check
  cancel-in-progress: false

jobs:
  check-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          # Always run against the latest state.json, not the commit that
          # was current when this (possibly long-delayed) run was queued.
          ref: main

      - name: Check weather and notify
        run: python3 scripts/carwash.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json unchanged — nothing to commit."
          else
            git commit -m "chore: update state [skip ci]"
            # If a PR merges to main while we're running, the push gets rejected.
            # Rebase our single state.json commit on top of the new main and retry.
            attempt=1
            until git push; do
              if [ $attempt -ge 3 ]; then
                echo "Push still failing after $attempt attempts — giving up."
                exit 1
              fi
              echo "Push rejected (attempt $attempt) — rebasing on latest main and retrying."
              # state.json is the only file this job writes; on a conflict
              # ours is the newer truth.
              git pull --rebase -X theirs origin main
              attempt=$((attempt + 1))
            done
          fi
