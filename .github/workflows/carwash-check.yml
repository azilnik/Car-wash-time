name: Daily Car Wash Check

on:
  schedule:
    # Fire every 30 minutes (UTC). The script reads your local timezone
    # from Open-Meteo's response and runs at most once per morning /
    # evening slot per local day, tracked in state.json. Redundant
    # firings exit cheaply without committing state; firings delayed by
    # GitHub Actions cron drift still catch the slot on the next tick.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Bypass the local-time window and send a notification now (for testing)."
        type: boolean
        default: false

# ── Configuration ─────────────────────────────────────────────────────
# Override these by going to:
#   Settings → Secrets and variables → Actions → Variables
# and creating LOCATION (easiest) and NTFY_TOPIC.
#
# LOCATION accepts anything Nominatim can resolve: city name, address,
# postal code. When set, it wins over LATITUDE/LONGITUDE. The first
# run after it changes does a single geocode call; the script caches
# the coordinates in state.json so subsequent runs are free.
#
# MORNING_HOUR and EVENING_HOUR are local hours at your LOCATION
# (defaults: 6 = 6:00 AM, 21.5 = 9:30 PM). Decimals are supported.
# Timezone is derived from your coordinates, so you never set it
# manually and DST is handled automatically.
#
# The LATITUDE/LONGITUDE defaults below point at New York City and a
# shared public demo ntfy topic, fine for a "does it work?" test,
# but you'll want your own topic for privacy (anyone subscribed to the
# demo topic sees everyone else's notifications).
#
# VARS_* mirror the raw repo-variable values so the script can tell
# whether each setting is customized or falling back to a demo default.
env:
  LOCATION:      ${{ vars.LOCATION      }}
  LATITUDE:      ${{ vars.LATITUDE      || '40.7128'  }}
  LONGITUDE:     ${{ vars.LONGITUDE     || '-74.0060' }}
  NTFY_TOPIC:    ${{ vars.NTFY_TOPIC    || 'car-wash-time-demo-a9k2p4xe' }}
  MORNING_HOUR:  ${{ vars.MORNING_HOUR  || '6' }}
  EVENING_HOUR:  ${{ vars.EVENING_HOUR  || '21.5' }}
  FORCE_RUN:     ${{ inputs.force_run }}
  VARS_LAT:      ${{ vars.LATITUDE      }}
  VARS_LON:      ${{ vars.LONGITUDE     }}
  VARS_TOPIC:    ${{ vars.NTFY_TOPIC    }}

# We need contents:write to commit state.json back to main after each
# run. That commit is both how we dedupe notifications across runs and
# how we keep GitHub from auto-disabling this scheduled workflow.
permissions:
  contents: write

jobs:
  check-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check weather and notify
        run: bash scripts/check.sh

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json unchanged — nothing to commit."
          else
            git commit -m "chore: update state [skip ci]"
            # If a PR merges to main while we're running, the push gets rejected.
            # Rebase our single state.json commit on top of the new main and retry.
            attempt=1
            until git push; do
              if [ $attempt -ge 3 ]; then
                echo "Push still failing after $attempt attempts — giving up."
                exit 1
              fi
              echo "Push rejected (attempt $attempt) — rebasing on latest main and retrying."
              git pull --rebase origin main
              attempt=$((attempt + 1))
            done
          fi
