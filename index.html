<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Wash Time</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Car Wash Time</h1>
            <p class="subtitle">AI-powered wash advisor &mdash; Toronto</p>
        </header>

        <section class="context-bar">
            <span id="season-display">Loading season...</span>
            <span id="aqi-display" class="aqi-display"></span>
        </section>

        <section class="forecast-card">
            <div id="forecast-status" class="status-banner hidden"></div>
            <div id="forecast-grid" class="forecast-grid">
                <p class="placeholder-text">Loading forecast...</p>
            </div>
            <div class="button-row">
                <button id="check-now" class="btn btn-primary">Refresh</button>
                <button id="send-test" class="btn btn-secondary">Send Test Notification</button>
            </div>
        </section>

        <section class="log-card">
            <h2>Activity Log</h2>
            <div id="log-output" class="log-output">
                <p class="placeholder-text">No activity yet.</p>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
