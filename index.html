<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Wash Time</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Car Wash Time</h1>
            <p class="subtitle">Get notified when the weather is perfect for a car wash</p>
        </header>

        <section class="settings-card">
            <h2>Settings</h2>
            <div class="form-group">
                <label for="latitude">Latitude</label>
                <input type="number" id="latitude" step="0.0001" placeholder="e.g. 40.7128">
            </div>
            <div class="form-group">
                <label for="longitude">Longitude</label>
                <input type="number" id="longitude" step="0.0001" placeholder="e.g. -74.0060">
            </div>
            <div class="form-group">
                <label for="ntfy-topic">ntfy.sh Topic</label>
                <input type="text" id="ntfy-topic" placeholder="e.g. my-carwash-alerts">
                <small>Pick a unique topic name. Subscribe to it in the <a href="https://ntfy.sh" target="_blank">ntfy app</a>.</small>
            </div>
            <div class="form-group">
                <label for="dry-days">Dry days required</label>
                <select id="dry-days">
                    <option value="2">2 days</option>
                    <option value="3" selected>3 days</option>
                    <option value="4">4 days</option>
                </select>
            </div>
            <div class="button-row">
                <button id="detect-location" class="btn btn-secondary">Detect My Location</button>
                <button id="save-settings" class="btn btn-primary">Save Settings</button>
            </div>
        </section>

        <section class="forecast-card">
            <h2>Forecast</h2>
            <div id="forecast-status" class="status-banner hidden"></div>
            <div id="forecast-grid" class="forecast-grid">
                <p class="placeholder-text">Configure your location above and click "Check Now" to see the forecast.</p>
            </div>
            <div class="button-row">
                <button id="check-now" class="btn btn-primary">Check Now</button>
                <button id="send-test" class="btn btn-secondary">Send Test Notification</button>
            </div>
        </section>

        <section class="log-card">
            <h2>Activity Log</h2>
            <div id="log-output" class="log-output">
                <p class="placeholder-text">No activity yet.</p>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
